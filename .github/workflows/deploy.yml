name: YouTube RAG Production Pipeline

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      execute_pipeline:
        description: "Authorize CI/CD & Deployments?"
        type: boolean
        required: true
        default: true
      enable_aws:
        description: "Deploy to AWS (ECR/S3/CodeDeploy)?"
        type: boolean
        required: true
        default: true

# Ensure only one deployment runs at a time per branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  # ─── MASTER CI/CD PERMISSION ─────────────────────────────────────────────
  # Set to "true" ONLY when you want GitHub Actions to run CI and deploy.
  # Set to "false" to pause/block automatic execution on git push.
  EXECUTE_PIPELINE: "false"

  # ─── PLATFORM TOGGLES ────────────────────────────────────────────────────
  ENABLE_AWS: "false"

  # ─── CLOUD CONFIGURATION ──────────────────────────────────────────────────
  AWS_REGION: ap-southeast-2
  ECR_REPOSITORY: youtube-rag-intelligence
  S3_DEPLOYMENT_BUCKET: youtube-rag-intelligence
  CODEDEPLOY_APPLICATION_NAME: youtube-rag-intelligence-app
  CODEDEPLOY_DEPLOYMENT_GROUP: youtube-rag-intelligence-group


jobs:
  # 0. Gatekeeper: Verify Execution Permission & Platform Targets
  verify-permission:
    name: Verify Execution Permission
    runs-on: ubuntu-latest
    outputs:
      authorized: ${{ steps.gatekeeper.outputs.authorized }}
      deploy_aws: ${{ steps.gatekeeper.outputs.deploy_aws }}
    steps:
      - name: Evaluate Permission
        id: gatekeeper
        run: |
          # Evaluate master pipeline permission
          if [ "${{ env.EXECUTE_PIPELINE }}" = "true" ] || [ "${{ inputs.execute_pipeline }}" = "true" ]; then
            echo "authorized=true" >> $GITHUB_OUTPUT
            echo "Pipeline execution AUTHORIZED."
          else
            echo "authorized=false" >> $GITHUB_OUTPUT
            echo "Pipeline execution BLOCKED (EXECUTE_PIPELINE is '${{ env.EXECUTE_PIPELINE }}')."
            echo "Set EXECUTE_PIPELINE: 'true' in deploy.yml to enable."
          fi

          # Evaluate AWS target
          if [ "${{ env.ENABLE_AWS }}" = "true" ] && [ "${{ inputs.enable_aws }}" != "false" ]; then
            echo "deploy_aws=true" >> $GITHUB_OUTPUT
          else
            echo "deploy_aws=false" >> $GITHUB_OUTPUT
          fi


  # 1. CI: Code Quality, Linting & Smoke Tests
  ci:
    name: CI - Code Validation & Smoke Tests
    needs: verify-permission
    if: needs.verify-permission.outputs.authorized == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 -r requirements.txt

      - name: Lint Critical Syntax Errors
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Validate Python Compilation
        run: |
          python -c "
          import py_compile, os
          count = 0
          for root, _, files in os.walk('.'):
              if any(p in root for p in ['.git', '__pycache__', '.venv']): continue
              for f in files:
                  if f.endswith('.py'):
                      py_compile.compile(os.path.join(root, f), doraise=True)
                      count += 1
          print(f'Successfully compiled {count} Python files with zero syntax errors.')
          "

      - name: Run Core Module Smoke Test
        run: |
          python -c "
          from backend.core.chunking import create_timestamp_aware_chunks
          from backend.core.graph import build_langgraph
          from backend.utils.timestamp import format_timestamp, parse_timestamp_seconds
          assert format_timestamp(65) == '01:05'
          assert parse_timestamp_seconds('01:05') == 65
          graph = build_langgraph()
          assert graph is not None
          print('Core RAG & LangGraph smoke test passed.')
          "


  # 2. CD: Build Container, Push to ECR & Deploy to AWS EC2
  deploy-aws:
    name: CD - Deploy to AWS (ECR & EC2)
    needs: [verify-permission, ci]
    if: needs.verify-permission.outputs.authorized == 'true' && needs.verify-permission.outputs.deploy_aws == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image Locally
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: app:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test Container Health Check
        run: |
          docker run -d --name test_container \
            -p 8000:8000 \
            -p 7860:7860 \
            app:${{ github.sha }}

          # Poll /health endpoint for up to 30 seconds
          for i in {1..15}; do
            sleep 2
            if curl -sf http://localhost:8000/health | grep healthy; then
              echo "FastAPI container passed pre-deployment health check!"
              break
            fi
          done

          curl --fail http://localhost:8000/health
          docker stop test_container
          docker rm test_container

      - name: Push Docker Image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker tag app:${{ github.sha }} $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          docker tag app:${{ github.sha }} $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:latest

          docker push $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          docker push $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:latest
          echo "Pushed image tags to ECR: ${{ github.sha }} and latest"

      - name: Package CodeDeploy Bundle
        run: |
          chmod +x deploy/scripts/*.sh
          zip -r deployment.zip \
            appspec.yml \
            deploy/scripts/install_dependencies.sh \
            deploy/scripts/stop_docker.sh \
            deploy/scripts/start_docker.sh

      - name: Upload Deployment Artifact to S3
        run: |
          aws s3 cp deployment.zip s3://${{ env.S3_DEPLOYMENT_BUCKET }}/deployment.zip

      - name: Trigger AWS CodeDeploy
        run: |
          DEPLOYMENT_ID=$(aws deploy create-deployment \
            --application-name ${{ env.CODEDEPLOY_APPLICATION_NAME }} \
            --deployment-group-name ${{ env.CODEDEPLOY_DEPLOYMENT_GROUP }} \
            --deployment-config-name CodeDeployDefault.OneAtATime \
            --s3-location bucket=${{ env.S3_DEPLOYMENT_BUCKET }},key=deployment.zip,bundleType=zip \
            --file-exists-behavior OVERWRITE \
            --region ${{ env.AWS_REGION }} \
            --query "deploymentId" \
            --output text)
          echo "AWS CodeDeploy deployment triggered successfully! Deployment ID: $DEPLOYMENT_ID"
